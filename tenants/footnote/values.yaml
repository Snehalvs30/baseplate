# Defaults for every environment. Environment files (values-local.yaml, later
# values-eks.yaml) override only what differs.

image:
  repository: ghcr.io/snehalvs30/footnote
  tag: "sha-97b7e32"   # the exact build that runs; a release changes this line
  pullPolicy: IfNotPresent   # pinned tags never change

replicas: 1

# Kubernetes Secret holding database-password, jwt-secret and anthropic-api-key.
# Created by External Secrets Operator from AWS Secrets Manager (see externalSecret).
secretName: footnote-secrets

llmProvider: anthropic
cookieSecure: true     # session cookies only over HTTPS

database:
  host: footnote-postgres
  urlOptions: ""       # e.g. "?sslmode=require" for RDS

# In-cluster PostgreSQL with pgvector: for local clusters. EKS uses RDS instead.
postgres:
  enabled: false
  image: pgvector/pgvector:pg17
  storage: 1Gi

ingress:
  enabled: true
  className: traefik
  host: footnote.example.com

resources:
  requests:
    cpu: 100m
    memory: 768Mi      # the embedding model is loaded at startup
  limits:
    memory: 1536Mi

# Where the Secret above comes from: a JSON secret in AWS Secrets Manager, synced by
# External Secrets Operator. Environments set remoteKey (e.g. baseplate/local/<tenant>).
externalSecret:
  enabled: true
  store: aws-secrets-manager
  remoteKey: ""
  refreshInterval: 1m   # short, so rotation shows up quickly; 1h is typical in production
