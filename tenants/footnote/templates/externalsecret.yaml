{{- if .Values.externalSecret.enabled }}
# The tenant's Secret, created and kept in sync by External Secrets Operator from
# AWS Secrets Manager. Every property of the remote JSON secret becomes a key here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
  labels:
    {{- include "footnote.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.store }}
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner      # ESO owns the Secret: deleting the ExternalSecret deletes it
    deletionPolicy: Retain     # if the AWS secret disappears, keep the last good copy
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.remoteKey }}
    {{- range .Values.externalSecret.extraRemoteKeys }}
    # Merged in: e.g. the database connection secret Terraform creates on AWS.
    - extract:
        key: {{ . }}
    {{- end }}
{{- end }}
