# Defaults for every environment; values-local.yaml (and later values-eks.yaml)
# override only what differs. Resource names (ledgerline, postgres, kafka) match
# Ledgerline's own k8s/ manifests, so its smoke test runs here unchanged.

image:
  repository: ghcr.io/snehalvs30/ledgerline
  tag: latest          # releases pin the commit SHA by changing this line in Git
  pullPolicy: Always

# Two instances on purpose: the outbox relay (FOR UPDATE SKIP LOCKED), Flyway and
# the Kafka consumer group all coordinate safely across replicas.
replicas: 2

# Kubernetes Secret with db-password and jwt-secret, created by External Secrets
# Operator from AWS Secrets Manager (see externalSecret below).
secretName: ledgerline-secrets

database:
  host: postgres
  name: ledgerline
  username: ledgerline
  urlOptions: ""       # e.g. "?sslmode=require" for RDS

# In-cluster PostgreSQL for local clusters; EKS uses RDS instead.
postgres:
  enabled: false
  image: postgres:17
  storage: 1Gi

# Single-node Kafka (KRaft). Runs in-cluster everywhere in this project; production
# would use a managed service (MSK) or an operator (Strimzi) with 3+ brokers.
kafka:
  enabled: true
  image: apache/kafka:4.0.0
  heapOpts: "-Xms256m -Xmx256m"   # Kafka defaults to 1 GB of heap; far more than a demo needs
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 640Mi }

ingress:
  enabled: true
  className: traefik
  host: ledgerline.example.com

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { memory: 768Mi }

# Where the Secret above comes from: a JSON secret in AWS Secrets Manager, synced by
# External Secrets Operator. Environments set remoteKey (e.g. baseplate/local/<tenant>).
externalSecret:
  enabled: true
  store: aws-secrets-manager
  remoteKey: ""
  refreshInterval: 1m   # short, so rotation shows up quickly; 1h is typical in production

# Distributed tracing with the OpenTelemetry Java agent (no code changes).
otel:
  enabled: false
  agentImage: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.10.0
  endpoint: http://otel-collector.platform-observability:4318
  environment: local
