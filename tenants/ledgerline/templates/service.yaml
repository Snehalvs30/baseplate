apiVersion: v1
kind: Service
metadata:
  name: ledgerline
  labels:
    {{- include "ledgerline.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: ledgerline
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if gt (int .Values.replicas) 1 }}
---
# Node drains and upgrades must leave at least one instance serving.
# (Skipped with a single replica, where it would block drains entirely.)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ledgerline
  labels:
    {{- include "ledgerline.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledgerline
      app.kubernetes.io/component: app
{{- end }}