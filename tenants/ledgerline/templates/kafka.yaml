{{- if .Values.kafka.enabled }}
# Single-node Kafka in KRaft mode (no ZooKeeper).
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    {{- include "ledgerline.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  selector:
    app.kubernetes.io/name: ledgerline
    app.kubernetes.io/component: kafka
  ports:
    - name: kafka
      port: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    {{- include "ledgerline.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  replicas: 1
  strategy:
    type: Recreate          # never two brokers with the same node ID
  selector:
    matchLabels:
      app.kubernetes.io/name: ledgerline
      app.kubernetes.io/component: kafka
  template:
    metadata:
      labels:
        {{- include "ledgerline.labels" . | nindent 8 }}
        app.kubernetes.io/component: kafka
    spec:
      # Otherwise Kubernetes injects KAFKA_PORT=tcp://... for the "kafka" Service,
      # and the Kafka image turns every KAFKA_* variable into configuration.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          ports:
            - name: kafka
              containerPort: 9092
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_HEAP_OPTS, value: {{ .Values.kafka.heapOpts | quote }} }
          readinessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 5
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
{{- end }}