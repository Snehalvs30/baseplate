name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate charts, manifests and Applications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13.0"

      - name: Install kubeconform and PyYAML
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
          pip install --quiet pyyaml

      - name: Validate
        run: ./tests/validate.sh
