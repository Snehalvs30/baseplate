# How External Secrets Operator reaches AWS Secrets Manager.
#
# Locally it authenticates with a read-only IAM user's access key, stored in the
# "aws-credentials" Secret: the one secret still created by hand ("secret zero").
# On EKS this is replaced by IRSA, with no stored keys at all.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-2
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            namespace: external-secrets
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            namespace: external-secrets
            key: secret-access-key
  # Only tenant namespaces may use this store.
  conditions:
    - namespaceSelector:
        matchExpressions:
          - key: baseplate.io/tenant
            operator: Exists
