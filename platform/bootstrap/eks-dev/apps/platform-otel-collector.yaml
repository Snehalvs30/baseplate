# Generated by day12-files.sh for the EKS dev cluster. Edit the values here,
# or regenerate from the local Applications and Terraform's outputs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-otel-collector
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.177.0
    helm:
      valuesObject:
        fullnameOverride: otel-collector
        mode: daemonset
        image:
          repository: otel/opentelemetry-collector-contrib
        service:
          enabled: true
        podAnnotations:
          prometheus.io/scrape: 'true'
          prometheus.io/port: '8889'
        ports:
          prom-exporter:
            enabled: true
            containerPort: 8889
            servicePort: 8889
            protocol: TCP
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
        config:
          exporters:
            otlp/tempo:
              endpoint: tempo.platform-observability.svc:4317
              tls:
                insecure: true
            prometheus:
              endpoint: 0.0.0.0:8889
          service:
            pipelines:
              traces:
                receivers:
                - otlp
                processors:
                - memory_limiter
                - batch
                exporters:
                - otlp/tempo
              metrics:
                receivers:
                - otlp
                processors:
                - memory_limiter
                - batch
                exporters:
                - prometheus
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
