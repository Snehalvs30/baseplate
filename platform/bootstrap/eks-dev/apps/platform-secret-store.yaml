# Generated by day12-files.sh for the EKS dev cluster. Edit the values here,
# or regenerate from the local Applications and Terraform's outputs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secret-store
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Snehalvs30/baseplate.git
    targetRevision: main
    path: platform/secret-store-eks
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
