# Ledgerline tenant: the Helm chart in this repository, with local-cluster values.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-ledgerline
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Snehalvs30/baseplate.git
    targetRevision: main
    path: tenants/ledgerline
    helm:
      valueFiles:
        - values.yaml
        - values-local.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: tenant-ledgerline
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true