# Ingress controller: routes requests for app hostnames (like footnote.localhost)
# to the right service. Traefik instead of Ingress-NGINX, which is being retired.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-traefik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.1.3
    helm:
      valuesObject:
        # A LoadBalancer service: k3s's built-in ServiceLB provides it locally, and k3d
        # maps ports 80/443 on the Mac to it. On EKS, AWS provides a real load balancer.
        # The service's address is also written into each Ingress's status.
        service:
          spec:
            type: LoadBalancer
        ingressClass:
          enabled: true
          isDefaultClass: true
          name: traefik        # a stable name, independent of the release name
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { memory: 192Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
