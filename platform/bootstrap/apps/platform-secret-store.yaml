# The connection from the cluster to AWS Secrets Manager. Depends on External
# Secrets Operator's resource types, so it retries until the operator is installed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secret-store
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Snehalvs30/baseplate.git
    targetRevision: main
    path: platform/secret-store
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
