# Reference tenant: a tiny app used to test the platform itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-podinfo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://stefanprodan.github.io/podinfo
    chart: podinfo
    targetRevision: 6.15.0
    helm:
      valuesObject:
        replicaCount: 1
        ui:
          message: "Hello from Baseplate"
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 64Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: tenant-podinfo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
