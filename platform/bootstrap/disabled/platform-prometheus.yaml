# Prometheus: collects metrics. Server only, trimmed for an 8 GB laptop
# (no Alertmanager, Pushgateway or node exporter; 12 hours of data in memory).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-prometheus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.38.0
    helm:
      valuesObject:
        alertmanager:
          enabled: false
        prometheus-pushgateway:
          enabled: false
        prometheus-node-exporter:
          enabled: false
        kube-state-metrics:        # Kubernetes object state: replicas, restarts, pod phases
          fullnameOverride: kube-state-metrics
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 96Mi }
        server:
          fullnameOverride: prometheus-server
          retention: 12h
          persistentVolume:
            enabled: false
          global:
            scrape_interval: 30s
            evaluation_interval: 30s
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 640Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
