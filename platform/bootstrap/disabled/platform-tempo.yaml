# Tempo: stores traces (single process, 24 hours, in memory).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-tempo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: 1.24.4
    helm:
      valuesObject:
        fullnameOverride: tempo
        persistence:
          enabled: false
        tempo:
          retention: 24h
          reportingEnabled: false
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: "0.0.0.0:4317"
                http:
                  endpoint: "0.0.0.0:4318"
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits: { memory: 384Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
