# Generated by day12-files.sh for the EKS dev cluster. Edit the values here,
# or regenerate from the local Applications and Terraform's outputs.
# External Secrets Operator authenticates with EKS Pod Identity, then assumes the
# tenant's role, which can read only that tenant's secrets. Each store is usable only
# from its tenant's namespace, and tenants can't create cluster-wide stores themselves.
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: tenant-ledgerline
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-2
      role: arn:aws:iam::670079394182:role/baseplate-dev-ledgerline-secrets
  conditions:
    - namespaceSelector:
        matchLabels:
          baseplate.io/tenant: ledgerline
---
